<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lahore Garrison University — Admissions</title>
  <!--
    Demo backdrop. This is a lightweight recreation of the LGU admission
    landing page so the chatbot can be shown on a realistic site before it's
    embedded on the real one. The bot itself is the green bubble, bottom-right.
    Images are LGU's own, saved locally under assets/.
  -->
  <style>
    :root {
      --green: #14532d;
      --green-dark: #0e3a1f;
      --gold: #f4b41a;
      --ink: #1c2622;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fff;
    }

    /* Top utility bar */
    .topbar {
      background: var(--green-dark); color: #fff; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 26px; flex-wrap: wrap; gap: 6px;
    }
    .topbar a { color: #fff; text-decoration: none; }

    /* Nav */
    nav {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 26px; flex-wrap: wrap;
    }
    nav .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
    nav .brand img { height: 44px; }
    nav .brand span { color: var(--green); font-weight: 700; font-size: 18px; }
    nav .pill {
      background: var(--gold); color: var(--green-dark); font-weight: 600;
      border: 0; border-radius: 999px; padding: 8px 18px; font-size: 14px;
      cursor: pointer; text-decoration: none;
    }
    nav .link { color: var(--ink); text-decoration: none; font-weight: 500; padding: 8px 6px; }
    nav .link:hover { color: var(--green); }
    nav .social { display: flex; gap: 8px; }
    nav .social span {
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      color: #fff; font-size: 13px;
    }

    /* Hero */
    .hero {
      display: grid; grid-template-columns: 1fr 1.05fr; gap: 30px;
      align-items: center; padding: 40px 40px 20px; max-width: 1200px; margin: 0 auto;
    }
    .hero h1 { font-size: 52px; line-height: 1.1; margin: 0 0 10px; }
    .hero h1 .g { color: var(--gold); }
    .hero h1 .d { color: var(--green); }
    .hero p.sub { font-size: 18px; color: #40514a; margin: 0 0 22px; }
    .hero .apply {
      background: var(--gold); color: var(--green-dark); font-weight: 700;
      border: 0; border-radius: 999px; padding: 13px 30px; font-size: 17px;
      cursor: pointer; box-shadow: 0 6px 18px rgba(244,180,26,.35);
    }
    .hero .photo {
      border-radius: 18px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,.22);
    }
    .hero .photo img { width: 100%; display: block; }

    /* Action buttons */
    .actions {
      display: flex; gap: 14px; justify-content: center; padding: 10px 20px 26px;
      flex-wrap: wrap;
    }
    .actions button {
      background: var(--gold); color: var(--green-dark); font-weight: 700;
      border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; cursor: pointer;
    }

    /* Admissions band */
    .band {
      background: var(--green); color: #fff; text-align: center;
      font-size: 24px; font-weight: 700; letter-spacing: .5px; padding: 16px;
    }

    /* Students strip */
    .strip {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px; padding: 20px 24px 90px; max-width: 1200px; margin: 0 auto;
    }
    .strip .card {
      height: 190px; border-radius: 12px; overflow: hidden;
      background: linear-gradient(160deg, #eaf3ec, #d7e8dc);
      display: grid; place-items: end center; position: relative;
    }
    .strip .card::after {
      content: ""; position: absolute; inset: 0;
      background: url("assets/students.webp") center/contain no-repeat;
      opacity: .9;
    }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .hero h1 { font-size: 40px; }
      nav { justify-content: center; }
      nav .brand { margin-right: 0; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span>Lahore Garrison University</span>
    <a href="mailto:admissions@lgu.edu.pk">✉ admissions@lgu.edu.pk</a>
  </div>

  <nav>
    <div class="brand">
      <img src="assets/logo.png" alt="Lahore Garrison University" />
    </div>
    <a class="pill" href="#">Home</a>
    <a class="link" href="#">About</a>
    <a class="link" href="#">Gallery</a>
    <a class="pill" href="https://lgu.edu.pk" target="_blank" rel="noopener">lgu.edu.pk</a>
    <div class="social">
      <span style="background:#1877f2">f</span>
      <span style="background:#0a66c2">in</span>
      <span style="background:#e1306c">◎</span>
    </div>
  </nav>

  <section class="hero">
    <div>
      <h1><span class="g">Join &amp;</span> Learn<br /><span class="d">anywhere anytime.</span></h1>
      <p class="sub">Take the first step toward your future.</p>
      <button class="apply">Apply Now 🎓</button>
    </div>
    <div class="photo">
      <img src="assets/banner.webp" alt="LGU campus" />
    </div>
  </section>

  <div class="actions">
    <button>✎ Edit Admission Form</button>
    <button>▤ Check Application Status</button>
  </div>

  <div class="band">ADMISSIONS FA-2026 — APPLY NOW</div>

  <div class="strip">
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>

  <!-- The chatbot. On the real site this same tag goes before </body>. -->
  <script src="/widget.js" data-api=""></script>
</body>
</html>
